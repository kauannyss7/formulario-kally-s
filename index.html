<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulário - Kally's Mashup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff5fa2,#b86cff,#66c7ff);
    padding:40px;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 25px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#ff3f8e;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

fieldset{
    border:2px solid #b86cff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

legend{
    color:#ff3f8e;
    font-size:20px;
    font-weight:bold;
    padding:0 10px;
}

label{
    font-weight:bold;
    color:#444;
}

input[type=text],
input[type=email],
input[type=number],
textarea{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

textarea{
    resize:none;
}

input[type=range]{
    width:100%;
    accent-color:#ff3f8e;
    margin-bottom:20px;
}

input[type=submit]{
    width:100%;
    padding:15px;
    background:#ff3f8e;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

input[type=submit]:hover{
    background:#e12573;
}

</style>

</head>

<body>

<div class="container">

</div>

</body>
</html>
